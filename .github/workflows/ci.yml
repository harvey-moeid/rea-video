name: CI

on:
  push:
    branches: [main, byga-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} · quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q rea_video scripts

      - name: Validate capability matrix
        run: python scripts/validate_capabilities.py --matrix

      - name: Verify CLI entry point
        run: |
          rea-video --help
          rea-video models

      - name: Run test suite when tests are present
        shell: bash
        run: |
          if [[ -d tests ]] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "::warning::No tracked Python test files found. Test execution skipped; add tests before production release."
          fi

      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Upload distribution artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rea-video-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
