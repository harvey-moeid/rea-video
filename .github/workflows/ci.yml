name: CI

on:
  push:
    branches: [main, byga-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip build ruff
          python -m pip install -e ".[dev]"
      - name: Lint (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 rea_video scripts tests
      - name: Compile Python sources
        run: python -m compileall -q rea_video scripts tests
      - name: Dependency consistency
        run: python -m pip check
      - name: Validate capability matrix
        run: python scripts/validate_capabilities.py --matrix
      - name: Test suite (must exist and must pass)
        run: |
          test "$(find tests -name 'test_*.py' | wc -l)" -ge 1
          python -m pytest -q
      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Upload distribution artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rea-video-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and API tests
        working-directory: worker
        run: npm test
      - name: Static check of the PWA and Worker syntax
        run: |
          for f in worker/src/*.js web/*.js; do node --check "$f"; done
          python3 -c "import json;json.load(open('web/manifest.webmanifest'))"
      - name: Guard - no secrets or public bucket configuration committed
        run: |
          ! grep -RInE "(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY)" worker web scripts .github docs
          ! grep -RniE "expiration|lifecycle" worker/wrangler.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --strict
