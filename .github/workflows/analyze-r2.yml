name: Analyze video from R2

# Manual / Worker-dispatched only. The Worker derives every input from D1 after checking ownership;
# this workflow re-validates them and refuses anything that is not the canonical key layout.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque job ID (32 hex)
        required: true
        type: string
      input_key:
        description: Source object key (users/<user>/jobs/<job>/input/original)
        required: true
        type: string
      output_prefix:
        description: Result prefix (users/<user>/jobs/<job>/results)
        required: true
        type: string
      language:
        description: Report language
        required: true
        default: en
        type: choice
        options: [en, zh]

permissions:
  contents: read

concurrency:
  group: rea-video-analysis-${{ inputs.job_id }}
  cancel-in-progress: false

env:
  MAX_INPUT_BYTES: "209715200" # keep in sync with the Worker's MAX_UPLOAD_BYTES

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          INPUT_KEY: ${{ inputs.input_key }}
          OUTPUT_PREFIX: ${{ inputs.output_prefix }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "Invalid job_id"; exit 1; }
          [[ "$INPUT_KEY" =~ ^users/([0-9a-f]{32})/jobs/([0-9a-f]{32})/input/original$ ]] || { echo "Invalid input_key"; exit 1; }
          USER_PART="${BASH_REMATCH[1]}"; JOB_PART="${BASH_REMATCH[2]}"
          [[ "$JOB_PART" == "$JOB_ID" ]] || { echo "input_key does not belong to job_id"; exit 1; }
          [[ "$OUTPUT_PREFIX" == "users/$USER_PART/jobs/$JOB_ID/results" ]] || { echo "Invalid output_prefix"; exit 1; }

      - name: Check required secrets
        shell: bash
        env:
          S1: ${{ secrets.R2_ACCOUNT_ID }}
          S2: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S4: ${{ secrets.R2_BUCKET_NAME }}
          S5: ${{ secrets.WORKER_CALLBACK_URL }}
          S6: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: |
          missing=""
          for n in S1:R2_ACCOUNT_ID S2:R2_ACCESS_KEY_ID S3:R2_SECRET_ACCESS_KEY S4:R2_BUCKET_NAME S5:WORKER_CALLBACK_URL S6:WORKER_CALLBACK_SECRET; do
            v="${n%%:*}"; if [[ -z "${!v}" ]]; then missing="$missing ${n##*:}"; fi
          done
          if [[ -n "$missing" ]]; then echo "::error::Missing GitHub Actions secrets:$missing"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg, project and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install . awscli

      - name: Notify Worker - started
        env:
          WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: python scripts/run_analysis.py callback --event started --job-id "${{ inputs.job_id }}"

      - name: Download original video from private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_KEY: ${{ inputs.input_key }}
        run: |
          set -euo pipefail
          mkdir -p work/input work/output
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "s3://$R2_BUCKET/$INPUT_KEY" work/input/original-video --only-show-errors
          test -s work/input/original-video

      - name: Run rea-video analysis
        env:
          ANALYSIS_ERROR_FILE: work/analysis_error.txt
        run: |
          python scripts/run_analysis.py analyze \
            --input work/input/original-video \
            --out work/output \
            --output-prefix "${{ inputs.output_prefix }}" \
            --lang "${{ inputs.language }}" \
            --max-bytes "$MAX_INPUT_BYTES" \
            --timeout 4200 \
            --manifest work/manifest.json

      - name: Upload analysis outputs to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          OUTPUT_PREFIX: ${{ inputs.output_prefix }}
        run: |
          aws --endpoint-url "$R2_ENDPOINT" s3 cp work/output/ "s3://$R2_BUCKET/$OUTPUT_PREFIX/" --recursive --only-show-errors

      - name: Notify Worker - completed
        env:
          WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: python scripts/run_analysis.py callback --event completed --job-id "${{ inputs.job_id }}" --manifest work/manifest.json

      - name: Notify Worker - failed
        if: failure() || cancelled()
        env:
          WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: |
          MSG="analysis failed; see GitHub Actions run ${GITHUB_RUN_ID}"
          if [[ -s work/analysis_error.txt ]]; then MSG="$(head -c 400 work/analysis_error.txt)"; fi
          python scripts/run_analysis.py callback --event failed --job-id "${{ inputs.job_id }}" --message "$MSG" || true

      # No artifact upload on purpose: outputs derive from the user's private video and must only live in R2.
      - name: Clean runner workspace
        if: always()
        run: rm -rf work
