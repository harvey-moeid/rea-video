name: Deploy to Cloudflare

# Manual only. Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, R2:Edit,
# Workers Routes) and CLOUDFLARE_ACCOUNT_ID. Worker runtime secrets are NOT set here; see docs/deployment/secrets.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test before deploy
        working-directory: worker
        run: npm test
      - name: Deploy Worker and PWA assets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          npx --yes wrangler@4 deploy
